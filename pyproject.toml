[project]
name = "prefpairs"
version = "0.1.0"
description = "RLHF preference-data toolkit: collect pairwise judgments, audit annotator quality, fit Bradley-Terry/Elo with bootstrap CIs, and export DPO/KTO/reward-model datasets."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vipul Raj Jha" }]
requires-python = ">=3.12,<3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.1",
    "pydantic>=2.9",
    "typer>=0.12",
]

[project.scripts]
prefpairs = "prefpairs.cli:app"

[project.urls]
Repository = "https://github.com/vipul21435/prefpairs"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prefpairs"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]
