[project]
name = "prefpairs"
version = "0.1.0"
description = "RLHF preference-data toolkit: collect pairwise judgments, audit annotator quality, fit Bradley-Terry/Elo with bootstrap CIs, and export DPO/KTO/reward-model datasets."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vipul Raj Jha" }]
requires-python = ">=3.12,<3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.1",
    "pydantic>=2.9",
    "typer>=0.12",
]

[project.scripts]
prefpairs = "prefpairs.cli:app"

[project.urls]
Repository = "https://github.com/vipul21435/prefpairs"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prefpairs"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "N", "PT", "RET", "PL", "S", "TID", "PTH",
    "NPY",
]
ignore = [
    "PLR0913", # CLI commands and model constructors legitimately take many arguments
    "PLR2004", # magic values are fine in comparisons against statistical constants
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S311"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pep8-naming]
# Matrix names such as W (win counts) and X (design matrix) follow statistics notation.
ignore-names = ["W", "X", "N", "K", "P", "T"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unreachable = true
pretty = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "slow: statistical recovery tests that fit many bootstrap replicates",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["prefpairs"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
